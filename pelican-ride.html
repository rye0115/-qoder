<script>
const svg = document.querySelector('svg');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
function draw(time) {
  const angle = reduced.matches ? 0.8 : time * Math.PI * 2 / 1400;
  for (const near of [false, true]) {
    const phase = angle + (near ? 0 : Math.PI);
    const x = 455 + 24 * Math.cos(phase), y = 432 + 24 * Math.sin(phase);
    const kneeX = 451 + 12 * Math.cos(phase), kneeY = 350 + 12 * Math.sin(phase);
    document.getElementById(near ? 'nearleg' : 'farleg').setAttribute('d',
      'M411 286 Q419 315 '+kneeX+' '+kneeY+' L'+(x-8)+' '+(y-5));
    if (near) {
      const foot = document.getElementById('foot');
      foot.setAttribute('transform','translate('+x+' '+y+')');
      foot.setAttribute('d','M-12-9 Q-4-9 13-4 L19 0 Q7 4-13 0Z');
    }
  }
  document.getElementById('crank').setAttribute('transform','rotate('+angle*180/Math.PI+' 455 432)');
  if (!reduced.matches) requestAnimationFrame(draw);
}
let animationEpoch = 0;
function start() {
  if (reduced.matches) svg.pauseAnimations();
  else svg.unpauseAnimations();
  draw(performance.now());
}
start();
reduced.addEventListener('change', () => location.reload());
</script>
